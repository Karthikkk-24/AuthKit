version: '3.9'

# Security notes (#16):
# - Postgres/Redis ports bind to 127.0.0.1 only (not LAN/cloud-exposed by default)
# - Set strong POSTGRES_PASSWORD and REDIS_PASSWORD before any shared deploy
# - Redis requires a password (default is local-dev only)

services:
  postgres:
    image: postgres:16-alpine
    container_name: authkit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: authkit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-authkit_dev_only_change_me}
      POSTGRES_DB: authkit
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U authkit']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: authkit_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-authkit_redis_dev_only}
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-authkit_redis_dev_only}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-authkit_redis_dev_only}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: authkit_api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://authkit:${POSTGRES_PASSWORD:-authkit_dev_only_change_me}@postgres:5432/authkit?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-authkit_redis_dev_only}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set for the api service}
      AUTHKIT_SECRET_KEY: ${AUTHKIT_SECRET_KEY:?AUTHKIT_SECRET_KEY must be a 64-char hex string}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-AuthKit <noreply@authkit.dev>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./authkit.config.json:/app/authkit.config.json:ro
      - ./keys:/app/keys:ro

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    container_name: authkit_admin
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3000/api/v1}
    depends_on:
      - api

  mailhog:
    image: mailhog/mailhog
    container_name: authkit_mail
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:
