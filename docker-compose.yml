version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: authkit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: authkit
      POSTGRES_PASSWORD: authkit_secret
      POSTGRES_DB: authkit
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U authkit']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: authkit-redis
    restart: unless-stopped
    command: redis-server --requirepass authkit_redis_secret --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'authkit_redis_secret', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: authkit-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://authkit:authkit_secret@postgres:5432/authkit
      REDIS_URL: redis://:authkit_redis_secret@redis:6379
      NODE_ENV: development
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm start:dev

volumes:
  postgres_data:
  redis_data:
